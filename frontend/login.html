<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to InternPath - Your Career Roadmap">
  <title>Login - InternPath</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/Gemini_Generated_Image_vbuxp9vbuxp9vbux-removebg-preview.png">
  <style>
    /* ============================================
       Login Page - Animated Cloud Background
       ============================================ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0604;
    }

    /* Animated Cloud Background */
    .cloud-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .cloud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    /* Cloud Layer 1 - Main clouds */
    .cloud-layer-1 {
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(255, 107, 0, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(180, 60, 0, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse 70% 60% at 50% 30%, rgba(139, 69, 19, 0.4) 0%, transparent 60%);
      animation: cloudMove1 25s linear infinite;
    }

    /* Cloud Layer 2 - Overlay clouds */
    .cloud-layer-2 {
      background:
        radial-gradient(ellipse 50% 30% at 30% 70%, rgba(255, 140, 0, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse 40% 50% at 70% 20%, rgba(205, 92, 0, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 10% 50%, rgba(160, 82, 45, 0.3) 0%, transparent 60%);
      animation: cloudMove2 35s linear infinite;
    }

    /* Cloud Layer 3 - Wispy details */
    .cloud-layer-3 {
      background:
        radial-gradient(ellipse 30% 20% at 60% 40%, rgba(255, 165, 0, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse 25% 35% at 20% 80%, rgba(210, 105, 30, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse 35% 25% at 90% 30%, rgba(255, 99, 71, 0.2) 0%, transparent 60%);
      animation: cloudMove3 20s linear infinite;
    }

    /* Cloud Layer 4 - Light streaks */
    .cloud-layer-4 {
      background:
        linear-gradient(85deg, transparent 30%, rgba(255, 200, 150, 0.1) 50%, transparent 70%);
      animation: lightStreak 8s ease-in-out infinite;
    }

    @keyframes cloudMove1 {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes cloudMove2 {
      0% {
        transform: translateX(-50%);
      }

      100% {
        transform: translateX(0);
      }
    }

    @keyframes cloudMove3 {
      0% {
        transform: translateX(0) scale(1);
      }

      50% {
        transform: translateX(-25%) scale(1.05);
      }

      100% {
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes lightStreak {

      0%,
      100% {
        opacity: 0;
        transform: translateX(-100%);
      }

      50% {
        opacity: 1;
        transform: translateX(100%);
      }
    }

    /* Particle stars */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: twinkle 3s ease-in-out infinite;
    }

    .star:nth-child(1) {
      top: 15%;
      left: 10%;
      animation-delay: 0s;
    }

    .star:nth-child(2) {
      top: 25%;
      left: 85%;
      animation-delay: 1s;
      width: 6px;
      height: 6px;
    }

    .star:nth-child(3) {
      top: 70%;
      left: 90%;
      animation-delay: 2s;
    }

    .star:nth-child(4) {
      top: 80%;
      left: 5%;
      animation-delay: 0.5s;
      width: 5px;
      height: 5px;
    }

    .star:nth-child(5) {
      top: 5%;
      left: 50%;
      animation-delay: 1.5s;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Login Container */
    .login-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Login Card */
    .login-card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      animation: cardSlideIn 0.6s ease-out;
    }

    @keyframes cardSlideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-input::placeholder {
      color: #666;
    }

    .form-input:focus {
      outline: none;
      border-color: #ff6b00;
      box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.2);
    }

    /* Remember Me */
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-wrapper input {
      width: 16px;
      height: 16px;
      accent-color: #ff6b00;
    }

    .checkbox-wrapper label {
      color: #888;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .forgot-link {
      color: #ff6b00;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #ff8533;
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff6b00, #ff8533);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 0, 0.5);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Sign Up Link */
    .signup-link {
      text-align: center;
      margin-top: 24px;
      color: #888;
      font-size: 0.9rem;
    }

    .signup-link a {
      color: #ff6b00;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .signup-link a:hover {
      color: #ff8533;
      text-decoration: underline;
    }

    /* Error Message */
    .error-message {
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: shake 0.5s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    /* Logo */
    .logo-header {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-header img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
    }

    .logo-header span {
      color: #fff;
      font-weight: 700;
      font-size: 1.25rem;
    }

    /* Loading spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      margin: 0 auto;
    }

    .btn-login.loading .spinner {
      display: inline-block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Logo -->
  <a href="index.html" class="logo-header">
    <img src="assets/Gemini_Generated_Image_vbuxp9vbuxp9vbux-removebg-preview.png" alt="InternPath">
    <span>InternPath</span>
  </a>

  <!-- Animated Cloud Background -->
  <div class="cloud-container">
    <div class="cloud-layer cloud-layer-1"></div>
    <div class="cloud-layer cloud-layer-2"></div>
    <div class="cloud-layer cloud-layer-3"></div>
    <div class="cloud-layer cloud-layer-4"></div>
  </div>

  <!-- Stars -->
  <div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <h1>Unlock Your Potential</h1>
      <p class="subtitle">Login to manage your college journey</p>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" class="form-input" id="email" placeholder="Email" required>
        </div>

        <div class="form-group">
          <input type="password" class="form-input" id="password" placeholder="Password" required>
        </div>

        <div class="remember-row">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Secure Login</span>
          <div class="spinner"></div>
        </button>
      </form>

      <p class="signup-link">
        Don't have an account? <a href="register.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Show loading state
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      errorMessage.classList.remove('show');

      try {
        const response = await API.auth.login(email, password);

        if (response.success) {
          // Try to sync user data from server
          if (window.DataSync) {
            await window.DataSync.loadAllUserData();
          }

          // Check onboarding status from MULTIPLE sources
          const localUser = JSON.parse(localStorage.getItem('internpath_user') || '{}');
          const hasLocalUserData = localUser.goal && localUser.name;
          
          // Fetch user profile to check onboarding status
          try {
            const userResponse = await API.auth.getCurrentUser();
            const user = userResponse.data?.user;
            const apiOnboardingComplete = user?.onboarding_completed === true;

            // User has completed onboarding if:
            // 1. API says onboarding_completed is true, OR
            // 2. User has local data with goal and name set (they went through onboarding before)
            if (apiOnboardingComplete || hasLocalUserData) {
              // Returning user - redirect to dashboard
              window.location.href = 'dashboard.html';
            } else {
              // First-time user - redirect to onboarding
              window.location.href = 'onboarding.html';
            }
          } catch (err) {
            // If user fetch fails, check local data as fallback
            console.error('Failed to fetch user profile:', err);
            if (hasLocalUserData) {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'onboarding.html';
            }
          }
        }
      } catch (error) {
        errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
        errorMessage.classList.add('show');
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    });

    // Forgot password handler
    document.getElementById('forgotPassword').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      if (!email) {
        errorMessage.textContent = 'Please enter your email first.';
        errorMessage.classList.add('show');
        return;
      }

      try {
        await API.auth.forgotPassword(email);
        errorMessage.style.background = 'rgba(76, 175, 80, 0.15)';
        errorMessage.style.borderColor = 'rgba(76, 175, 80, 0.3)';
        errorMessage.style.color = '#81c784';
        errorMessage.textContent = 'Password reset link sent to your email!';
        errorMessage.classList.add('show');
      } catch (error) {
        errorMessage.textContent = 'Failed to send reset link. Try again.';
        errorMessage.classList.add('show');
      }
    });

    // Redirect if already logged in
    if (API.auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>

</html>
